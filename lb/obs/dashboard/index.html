<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load Balancer Dashboard</title>
<style>
  /* Large type and strong contrast so the page can be read from the back of a lab. */
  :root {
    --bg: #0b0f14; --panel: #151c26; --text: #ffffff; --muted: #b8c4d4;
    --up: #3ddc84; --down: #ff5c5c; --line: #3a475a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 28px; background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 26px; line-height: 1.3;
  }
  h1 { margin: 0 0 14px; font-size: 36px; }
  h2 { margin: 26px 0 8px; font-size: 28px; color: var(--muted); font-weight: 600; }
  #banner {
    background: var(--down); color: #000; font-weight: 700; padding: 12px 18px;
    margin-bottom: 16px; border-radius: 8px;
  }
  #banner[hidden] { display: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .card .label { color: var(--muted); font-size: 20px; }
  .card .value { font-size: 40px; font-weight: 700; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 2px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 22px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  /* Health is shown with a dot AND the words UP or DOWN, never colour alone. */
  .up { color: var(--up); font-weight: 700; }
  .down { color: var(--down); font-weight: 700; }
  tr.is-down td { background: #3a1517; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 14px; border-bottom: 2px solid var(--line); background: var(--panel); }
  .time { color: var(--muted); }
  .empty { color: var(--muted); padding: 10px 14px; background: var(--panel); }
</style>
</head>
<body>
  <h1>Load Balancer</h1>
  <div id="banner" role="alert" hidden>CONNECTION LOST: no data from /stats (3 failed polls). Showing the last known values.</div>

  <div class="cards">
    <div class="card"><div class="label">Algorithm</div><div class="value" id="algorithm">-</div></div>
    <div class="card"><div class="label">Uptime</div><div class="value" id="uptime">-</div></div>
    <div class="card"><div class="label">Total requests</div><div class="value" id="total">-</div></div>
    <div class="card"><div class="label">Errors</div><div class="value" id="errors">-</div></div>
    <div class="card"><div class="label">Error rate</div><div class="value" id="errorpct">-</div></div>
  </div>

  <h2>Latency</h2>
  <div class="cards">
    <div class="card"><div class="label">p50</div><div class="value" id="p50">-</div></div>
    <div class="card"><div class="label">p95</div><div class="value" id="p95">-</div></div>
    <div class="card"><div class="label">p99</div><div class="value" id="p99">-</div></div>
  </div>

  <h2>Backends</h2>
  <table>
    <thead><tr>
      <th>Backend</th><th class="num">Requests</th><th class="num">Share</th>
      <th class="num">Active</th><th>Health</th><th class="num">Errors</th>
    </tr></thead>
    <tbody id="backends"></tbody>
  </table>

  <h2>Recent health events</h2>
  <ul id="events"></ul>

<script>
"use strict";
// Plain JavaScript, no libraries, no network access except this server's /stats.
const POLL_MS = 1000;      // how often to ask for new data
const TIMEOUT_MS = 2000;   // give up on one request after this long
const FAIL_LIMIT = 3;      // consecutive failures before the banner appears
let failures = 0;

const $ = (id) => document.getElementById(id);

// Helper: create an element with text. textContent (never innerHTML) is used so
// that backend names or reasons can never be interpreted as HTML.
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function fmtInt(n) { return Number(n).toLocaleString("en-US"); }
function fmtMs(v) { return Number(v).toFixed(1) + " ms"; }
function fmtPct(part, whole) { return whole > 0 ? (100 * part / whole).toFixed(1) + " %" : "0.0 %"; }

function fmtUptime(seconds) {
  const s = Math.floor(seconds);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return (h ? h + "h " : "") + (h || m ? m + "m " : "") + r + "s";
}

function renderBackends(data) {
  const rows = [];
  for (const [id, b] of Object.entries(data.per_backend)) {
    const tr = el("tr", undefined, b.healthy ? "" : "is-down");
    tr.appendChild(el("td", id));
    tr.appendChild(el("td", fmtInt(b.requests), "num"));
    tr.appendChild(el("td", fmtPct(b.requests, data.total_requests), "num"));
    tr.appendChild(el("td", fmtInt(b.active), "num"));
    tr.appendChild(el("td", (b.healthy ? "\u25CF UP" : "\u25CF DOWN"), b.healthy ? "up" : "down"));
    tr.appendChild(el("td", fmtInt(b.errors), "num"));
    rows.push(tr);
  }
  $("backends").replaceChildren(...rows);
}

function renderEvents(events) {
  // The server sends oldest first; the page shows the newest 10 first.
  const recent = events.slice(-10).reverse();
  if (recent.length === 0) {
    $("events").replaceChildren(el("div", "No health changes yet.", "empty"));
    return;
  }
  const items = recent.map((e) => {
    const li = document.createElement("li");
    li.appendChild(el("span", e.ts.slice(11, 23) + " UTC  ", "time"));
    li.appendChild(el("span", e.backend + " "));
    li.appendChild(el("span", e.healthy ? "UP" : "DOWN", e.healthy ? "up" : "down"));
    li.appendChild(el("span", "  " + e.reason, "time"));
    return li;
  });
  $("events").replaceChildren(...items);
}

function render(data) {
  $("algorithm").textContent = data.algorithm || "-";
  $("uptime").textContent = fmtUptime(data.uptime_s);
  $("total").textContent = fmtInt(data.total_requests);
  $("errors").textContent = fmtInt(data.errors);
  $("errorpct").textContent = fmtPct(data.errors, data.total_requests);
  $("p50").textContent = fmtMs(data.latency_ms.p50);
  $("p95").textContent = fmtMs(data.latency_ms.p95);
  $("p99").textContent = fmtMs(data.latency_ms.p99);
  renderBackends(data);
  renderEvents(data.health_events);
}

// One poll at a time: the next poll is scheduled only after the previous one
// has finished, so slow responses can never pile up.
async function poll() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  try {
    const response = await fetch("/stats", { cache: "no-store", signal: controller.signal });
    if (!response.ok) throw new Error("HTTP " + response.status);
    render(await response.json());
    failures = 0;
  } catch (err) {
    failures += 1;
  } finally {
    clearTimeout(timer);
    $("banner").hidden = failures < FAIL_LIMIT;
    setTimeout(poll, POLL_MS);
  }
}
poll();
</script>
</body>
</html>
